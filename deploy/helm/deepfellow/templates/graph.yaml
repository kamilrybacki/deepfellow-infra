{{- if .Values.server.graph.enabled }}
{{- $fullname := include "deepfellow.componentName" (dict "context" . "component" "falkordb") }}
{{- $selector := include "deepfellow.selectorLabels" (dict "context" . "component" "falkordb") }}
{{- $serverSecret := include "deepfellow.credSecretName" (dict "context" . "component" "server") }}
{{- $g := .Values.server.graph }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: falkordb
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: falkordb
spec:
  serviceName: {{ $fullname }}
  replicas: 1
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
    spec:
      {{- include "deepfellow.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "deepfellow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: falkordb
          image: {{ include "deepfellow.image" (dict "context" . "image" $g.image) }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          securityContext:
            {{- include "deepfellow.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          env:
            {{- include "deepfellow.credEnv" (dict "name" "DF_GRAPH__PASSWORD" "cred" $g.password "secretName" $serverSecret "required" true) | nindent 12 }}
            - name: REDIS_ARGS
              value: "--requirepass $(DF_GRAPH__PASSWORD)"
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $g.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $g.storage.size }}
{{- end }}
