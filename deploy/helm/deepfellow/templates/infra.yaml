{{- $fullname := include "deepfellow.componentName" (dict "context" . "component" "infra") -}}
{{- $secretName := include "deepfellow.credSecretName" (dict "context" . "component" "infra") -}}
{{- $selector := include "deepfellow.selectorLabels" (dict "context" . "component" "infra") -}}
{{/* --- chart-managed Secret for value/generate credentials --- */}}
{{- $sec := include "deepfellow.chartSecret" (dict "context" . "secretName" $secretName "creds" (dict "adminApiKey" .Values.infra.auth.adminApiKey "apiKey" .Values.infra.auth.apiKey "huggingFaceToken" .Values.infra.huggingFaceToken)) -}}
{{- with $sec }}
{{ . }}
---
{{- end }}
{{- if not .Values.infra.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: infra
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.infra.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infra.storage.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: infra
spec:
  type: {{ .Values.infra.service.type }}
  ports:
    - name: http
      port: {{ .Values.infra.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
    spec:
      {{- include "deepfellow.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "deepfellow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: infra
          image: {{ include "deepfellow.image" (dict "context" . "image" .Values.infra.image) }}
          imagePullPolicy: {{ .Values.infra.image.pullPolicy }}
          securityContext:
            {{- include "deepfellow.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: DF_NAME
              value: {{ .Release.Name | quote }}
            - name: DF_INFRA_URL
              value: {{ printf "http://%s:%v" $fullname .Values.infra.service.port | quote }}
            - name: DF_STORAGE_DIR
              value: {{ .Values.infra.storage.mountPath | quote }}
            - name: DF_MESH_KEY
              value: {{ .Values.infra.mesh.key | quote }}
            {{- if .Values.infra.mesh.enabled }}
            - name: DF_CONNECT_TO_MESH_URL
              value: {{ .Values.infra.mesh.connectUrl | quote }}
            {{- end }}
            {{- if .Values.infra.externalOnly.enabled }}
            - name: DF_EXTERNAL_ONLY
              value: "true"
            {{- end }}
            {{- include "deepfellow.credEnv" (dict "name" "DF_INFRA_ADMIN_API_KEY" "cred" .Values.infra.auth.adminApiKey "secretName" $secretName "required" true) | nindent 12 }}
            {{- include "deepfellow.credEnv" (dict "name" "DF_INFRA_API_KEY" "cred" .Values.infra.auth.apiKey "secretName" $secretName "required" true) | nindent 12 }}
            {{- include "deepfellow.credEnv" (dict "name" "DF_HUGGING_FACE_TOKEN" "cred" .Values.infra.huggingFaceToken "secretName" $secretName) | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.infra.storage.mountPath }}
          livenessProbe:
            exec:
              command: ["/app/scripts/healthcheck.py"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/app/scripts/healthcheck.py"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.infra.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.infra.storage.existingClaim | default $fullname }}
      {{- with .Values.infra.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infra.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infra.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
