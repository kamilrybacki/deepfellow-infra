image: python:3.13

stages:
  # - security
  - analysis
  - test
  - build
  - deploy
  - smoke-test
  - release

variables:
  DOCKER_TLS_CERTDIR: ""
  UV_VERSION: "0.11"
  PYTHON_VERSION: "3.13"
  BASE_LAYER: trixie
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  # Smoke suite target: the environment deploy_to_dev rolls out to.
  DF_SMOKE_URL: "https://dfinfra.test.simplito.com"
  # Pinned deliberately: an unpinned install would silently pick up new majors.
  BRUNO_CLI_VERSION: "4.0.0"

.uv: &uv
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    - uv sync --frozen
    - uv cache prune --ci

ruff:
  <<: *uv
  stage: analysis
  script:
    - uv run ruff check server/ tests/
  except:
    - tags

ruff-format:
  <<: *uv
  stage: analysis
  script:
    - uv run ruff format --check server/ tests/
  except:
    - tags

pyright:
  <<: *uv
  stage: analysis
  script:
    - PYRIGHT_PYTHON_NODE_VERSION=24.10.0 uv run pyright
  except:
    - tags

check-auth:
  <<: *uv
  stage: analysis
  script:
    - uv run python ./server/scripts/check_auth.py static ./server/ -v
    - uv run python ./server/scripts/check_auth.py runtime ./server/main.py -v
  except:
    - tags

biome:
  stage: analysis
  image: node:24-alpine
  script:
    - cd webui
    - npm ci
    - npx biome check src
  except:
    - tags

check-version-bump:
  <<: *uv
  stage: analysis
  variables:
    UV_CACHE_DIR: .uv-cache
    # Full clone so all release tags are available for comparison.
    GIT_DEPTH: 0
  script:
    - command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git)
    - git fetch --tags --quiet
    - |
      LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
      NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
      echo "Last tag: ${LAST_TAG:-<none>}, New version: $NEW_VERSION"
      if [ -n "$LAST_TAG" ]; then
        LAST_VERSION=${LAST_TAG#v}
        if [ "$NEW_VERSION" = "$LAST_VERSION" ]; then
          echo "ERROR: version in pyproject.toml ($NEW_VERSION) was not bumped (still same as last tag $LAST_TAG)"
          exit 1
        fi
        HIGHEST=$(printf '%s\n%s\n' "$LAST_VERSION" "$NEW_VERSION" | sort -V | tail -1)
        if [ "$HIGHEST" != "$NEW_VERSION" ]; then
          echo "ERROR: version in pyproject.toml ($NEW_VERSION) is lower than last tag $LAST_TAG"
          exit 1
        fi
      fi
    - |
      if grep -q '## \[Unreleased\]' CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md still has [Unreleased] section — rename it to the new version before release (see RELEASE.md)"
        exit 1
      fi
      CL_VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      if [ "$CL_VERSION" != "$NEW_VERSION" ]; then
        echo "ERROR: top CHANGELOG.md version (${CL_VERSION:-<none>}) does not match pyproject.toml ($NEW_VERSION)"
        exit 1
      fi
  only:
    - /^release\/.*$/

pytest:
  <<: *uv
  stage: test
  script:
    - uv run pytest --showlocals --tb=auto -ra --cov server --cov scripts --cov-branch --cov-report=term-missing --cov-report xml:coverage_server.xml --no-cov-on-fail tests/
  coverage: '/(?i)total.*? (100(?:\.0)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_server.xml
  except:
    - tags

build_and_publish_docker_image:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  script:
    - export IMAGE_ID=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - export DEV_IMAGE_ID=$CI_REGISTRY_IMAGE:dev
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_ID -t $DEV_IMAGE_ID .
    - docker push $IMAGE_ID
    - docker push $DEV_IMAGE_ID
  except:
    - tags
  only:
    - main
    - /^hotfix-.*$/

tag_docker_image:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  script:
    - export IMAGE_ID=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - export IMAGE_TAG_ID=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_ID
    - docker tag $IMAGE_ID $IMAGE_TAG_ID
    - docker push $IMAGE_TAG_ID
  except:
    - branches
  only:
    - tags

deploy_to_dev:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - export IMAGE_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}
    - 'curl --fail-with-body -H "X-Token: $DEV_TOKEN" https://apps.test.simplito.com/api/deploy?image_version=$IMAGE_VERSION'
  only:
    - main
    - /^hotfix-.*$/
    - tags
  environment:
    name: dev
    url: https://dfinfra.test.simplito.com/

# Read-only smoke suite against the deployed instance (see tests/bruno/README.md).
# Runs after every deploy_to_dev. On a tag the stage order (deploy -> smoke-test
# -> release) makes it the blocking gate for push_to_github; the version
# assertion applies to tags only.
smoke-test:
  stage: smoke-test
  image: node:24-alpine
  variables:
    SMOKE_POLL_ATTEMPTS: "60"  # 60 * 5s = 5 min
  before_script:
    - apk add --no-cache curl
    - npm install -g "@usebruno/cli@$BRUNO_CLI_VERSION"
  script:
    - |
      echo "Waiting for $DF_SMOKE_URL/health ..."
      for _ in $(seq 1 "${SMOKE_POLL_ATTEMPTS:-60}"); do
        curl -sf "$DF_SMOKE_URL/health" >/dev/null && break
        sleep 5
      done
      curl -sf "$DF_SMOKE_URL/health" >/dev/null || {
        echo "ERROR: $DF_SMOKE_URL never became healthy"; exit 1;
      }
    - |
      # /health can still be answered by the previous build mid-rollout, so on a
      # tag wait for the new version before asserting anything.
      export EXPECTED_VERSION="${SMOKE_EXPECTED_TAG#v}"
      if [ -n "$EXPECTED_VERSION" ]; then
        echo "Waiting for $DF_SMOKE_URL/info to report $EXPECTED_VERSION ..."
        for _ in $(seq 1 "${SMOKE_POLL_ATTEMPTS:-60}"); do
          ACTUAL=$(curl -sf -H "Authorization: Bearer $DF_INFRA_API_KEY" "$DF_SMOKE_URL/info" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version))}catch(e){}})")
          echo "  /info reports: ${ACTUAL:-<unreachable>}"
          [ "$ACTUAL" = "$EXPECTED_VERSION" ] && break
          sleep 5
        done
      fi
    - |
      # Bruno reads {{process.env.X}} from the collection's .env file only; it
      # does not inherit exported shell variables.
      umask 077
      cat > tests/bruno/.env <<EOF
      API_TOKEN=$DF_INFRA_API_KEY
      ADMIN_TOKEN=$DF_INFRA_ADMIN_API_KEY
      EXPECTED_VERSION=${SMOKE_EXPECTED_TAG#v}
      EOF
    - cd tests/bruno  # bru only runs from a collection root; -r descends into smoke/ and auth/
    - >
      bru run . -r
      --env-var host="$DF_SMOKE_URL"
      --reporter-junit "$CI_PROJECT_DIR/smoke-results.xml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        SMOKE_EXPECTED_TAG: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix-.*$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: smoke-results.xml

push_to_github:
  stage: release
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - git fetch origin main
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "ERROR: tag $CI_COMMIT_TAG ($CI_COMMIT_SHA) is not on main. Release tags must be created from main (after merge)." >&2
        exit 1
      fi
    - git remote add github https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/simplito/deepfellow-infra.git
    - git push github HEAD:refs/heads/main
    - git push github $CI_COMMIT_TAG
